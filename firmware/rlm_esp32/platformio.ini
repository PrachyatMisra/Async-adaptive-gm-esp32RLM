; PlatformIO alternative to the Arduino IDE.
;   pio run -e esp32dev            (classic ESP32 DevKit, Xtensa LX6)
;   pio run -e esp32-s3-devkitc-1  (ESP32-S3, Xtensa LX7 + SIMD)
;   pio run -e wokwi               (Wokwi simulation of the classic ESP32)
;   pio run -e esp32dev -t upload && pio device monitor
;   pio run -e esp32dev -t size    (flash/RAM usage report)
;
; IMPORTANT - RLM_MAX_SEQ MUST NOT BE OVERRIDDEN
;   RLM_MAX_SEQ is the *model* context length the exported weights were
;   trained with (96). Overriding it changes the positional-encoding table
;   and therefore changes the model's output, which would invalidate the
;   approved golden vectors. RLM_MAX_TOKENS is the separate *deployment*
;   cap that bounds the scratch buffers; it may be lowered, never raised
;   above RLM_MAX_SEQ.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -O2
    -DRLM_MAX_TOKENS=32

[env:wokwi]
platform = espressif32@^6.7.0
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
build_flags =
    -O2
    -DRLM_MAX_TOKENS=32

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -O2
    -DRLM_MAX_TOKENS=32
